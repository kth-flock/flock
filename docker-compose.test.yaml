services:
  express-api:
    environment:
      DATABASE_URL: postgresql://test:test@postgres-test:5432/flock_test
    depends_on:
      - postgres-test

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: flock_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U test -d flock_test"]
      interval: 1s
      timeout: 3s
      retries: 30
