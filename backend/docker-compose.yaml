name: Flock Project
services:
  # Express API Service
  # express-api:
  #   build:
  #     context: ./express-api
  #   container_name: quack_express_api
  #   restart: always
  #   ports:
  #     - "4000:3000" # backend API
  #   depends_on:
  #     - postgres
  #   environment:
  #     DATABASE_URL: "postgresql://quack:quackly@postgres:5432/quackdatabase?schema=public"
  #   volumes:
  #     - ./express-api:/app
  #     - node_modules:/app/node_modules

  # PostgreSQL service
  postgres:
    image: postgres:16
    container_name: postgres_flock
    restart: always # if there are any issues, try to restart it
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
