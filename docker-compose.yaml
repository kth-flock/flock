name: flock

services:
  express-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flock_express_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    env_file:
      - .env

    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules

  postgres:
    image: postgres:16
    container_name: postgres_flock2
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
